schema_version: 1

context:
  version: "3.6.4"

package:
  name: postgis
  version: ${{ version }}

source:
  url: https://github.com/postgis/postgis/archive/${{ version }}.tar.gz
  sha256: 4f80e1a4d227f088ae818f79180debd5894c075615823e0f556f73479cf1f200

build:
  number: 1
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - pkg-config
    - autoconf
    - automake
    - libtool
    - make
    - perl 5.*
    - libxslt
    - gettext-tools
    - protobuf-c
  host:
    - cunit
    - libgdal-core
    - geos
    - pcre2
    - proj
    - json-c
    - postgresql
    - protobuf-c
    - libiconv
    - libpq
    - libxml2-devel
    - liblzma-devel
  run:
    - postgresql
    - protobuf-c

tests:
  - files:
      recipe:
        - test_data
        - run_test.sh
        - pg.sh
    script:
      - shp2pgsql test_data/test.shp
      - pgsql2shp
      - raster2pgsql
      - bash run_test.sh

about:
  license: GPL-2.0-or-later
  license_file: LICENSE.TXT
  summary: PostGIS adds geometry, geography, raster and other types to the PostgreSQL database.
  description: |
    PostGIS is a spatial database extender for PostgreSQL object-relational
    database. It adds support for geographic objects allowing location
    queries to be run in SQL.
  homepage: http://postgis.net
  repository: https://git.osgeo.org/gitea/postgis/postgis
  documentation: http://postgis.net/documentation/

extra:
  recipe-maintainers:
    - sodre
    - dwnoble
    - xylar
    - mxr-conda
    - travishathaway
